        const scrollToTop = () => {

        const Lobby = ({ onGameStart }) => {
            const [names, setNames] = useState([]);
            const [nameInput, setNameInput] = useState("");
            // Changed from single string to ARRAY of strings
            const [selectedCategories, setSelectedCategories] = useState(['random']);
            const [generatedTeams, setGeneratedTeams] = useState(null);
            const [rouletteEnabled, setRouletteEnabled] = useState(true);
            const [numTeams, setNumTeams] = useState(2);

            const [draggedPlayer, setDraggedPlayer] = useState(null);

            const availableCategories = Object.keys(WORD_DB);

            const addName = () => {
                if (nameInput.trim().length > 0) {
                    setNames([...names, nameInput.trim()]);
                    setNameInput("");
                }
            };

            const toggleCategory = (cat) => {
                setSelectedCategories(prev => {
                    if (prev.includes(cat)) {
                        // Don't allow empty if it's the last one, or just handle empty validation elsewhere
                        if (prev.length === 1) return prev;
                        return prev.filter(c => c !== cat);
                    } else {
                        return [...prev, cat];
                    }
                });
            };

            const toggleAllCategories = () => {
                if (selectedCategories.length === availableCategories.length) {
                    setSelectedCategories([]);
                } else {
                    setSelectedCategories(availableCategories);
                }
            };

            const generateTeams = () => {
                const shuffled = [...names].sort(() => 0.5 - Math.random());
                const actualNumTeams = Math.min(numTeams, names.length, TEAM_COLORS.length);

                const teams = Array.from({ length: actualNumTeams }, (_, i) => ({
                    ...TEAM_COLORS[i],
                    members: [],
                    score: 0
                }));

                shuffled.forEach((name, i) => {
                    teams[i % actualNumTeams].members.push(name);
                });

                setGeneratedTeams(teams);
            };

            const onDragStart = (e, player, sourceTeamIndex) => {
                setDraggedPlayer({ player, sourceTeamIndex });
            };

            const onDragOver = (e) => {
                e.preventDefault();
            };

            const onDrop = (e, targetTeamIndex) => {
                e.preventDefault();
                if (!draggedPlayer) return;

                const { player, sourceTeamIndex } = draggedPlayer;
                if (sourceTeamIndex === targetTeamIndex) return;

                const newTeams = [...generatedTeams];
                // Remove from old
                newTeams[sourceTeamIndex].members = newTeams[sourceTeamIndex].members.filter(m => m !== player);
                // Add to new
                newTeams[targetTeamIndex].members.push(player);

                setGeneratedTeams(newTeams);
                setDraggedPlayer(null);
            };

            if (generatedTeams) {
                return (
                    <div className="flex flex-col h-screen p-4 overflow-y-auto">
                        <h2 className="text-3xl font-display text-center mb-6 mt-4">Equipos Listos</h2>
                        <p className="text-center text-gray-400 text-sm mb-4">¡Arrastra los nombres para cambiar de equipo!</p>
                        <div className="space-y-4 mb-8 flex-1">
                            {generatedTeams.map((team, i) => (
                                <Card
                                    key={i}
                                    className={`border-l-8 ${team.bg.replace('bg-', 'border-')} flex flex-col transition-transform hover:scale-[1.01]`}
                                    onDragOver={onDragOver}
                                    onDrop={(e) => onDrop(e, i)}
                                >
                                    <div
                                        className="h-full w-full"
                                        onDragOver={onDragOver}
                                        onDrop={(e) => onDrop(e, i)}
                                    >
                                        <h3 className={`text-xl font-bold ${team.text} mb-2 pointer-events-none`}>Equipo {team.name}</h3>
                                        <div className="flex flex-wrap gap-2 pointer-events-none">
                                            {team.members.map((m, idx) => (
                                                <span
                                                    key={idx}
                                                    draggable="true"
                                                    onDragStart={(e) => {
                                                        e.stopPropagation();
                                                        onDragStart(e, m, i);
                                                    }}
                                                    className="bg-white/10 px-3 py-1 rounded-full text-sm font-bold cursor-grab active:cursor-grabbing hover:bg-white/20 pointer-events-auto"
                                                >
                                                    {m}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </Card>
                            ))}
                        </div>
                        <div className="flex gap-4 mb-4">
                            <Button onClick={() => setGeneratedTeams(null)} color="gray" className="flex-1">Rehacer</Button>
                            {/* Pass array of categories */}
                            <Button onClick={() => onGameStart(generatedTeams, selectedCategories, rouletteEnabled)} color="brand-yellow" className="flex-1">¡Empezar!</Button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen p-4">
                    <h2 className="text-3xl font-display text-center mb-6 mt-4">Configuración</h2>

                    <div className="flex-1 overflow-y-auto space-y-6 pb-20">
                        {/* Player Input */}
                        <section>
                            <label className="block text-sm font-bold text-gray-400 uppercase mb-2">Jugadores</label>
                            <div className="flex gap-2 mb-3">
                                <input
                                    type="text"
                                    value={nameInput}
                                    onChange={(e) => setNameInput(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && addName()}
                                    className="flex-1 bg-gray-800 rounded-xl px-4 py-2 border-2 border-gray-700 focus:border-brand-pink outline-none transition-colors"
                                    placeholder="Nombre..."
                                />
                                <Button onClick={addName} size="md" color="brand-cyan"><Icon name="add" size="sm" /></Button>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {names.map((n, i) => (
                                    <span key={i} className="bg-brand-purple px-3 py-1 rounded-full text-sm font-bold animate-pop flex items-center gap-2">
                                        {n} <button onClick={() => setNames(names.filter((_, idx) => idx !== i))}><Icon name="close" size="sm" className="text-xs opacity-50 hover:opacity-100" /></button>
                                    </span>
                                ))}
                                {names.length === 0 && <p className="text-gray-500 text-sm italic">Añade al menos 2 jugadores...</p>}
                            </div>
                        </section>

                        {/* Team Selection */}
                        <section>
                            <label className="block text-sm font-bold text-gray-400 uppercase mb-2">Número de Equipos</label>
                            <div className="flex gap-2">
                                {[2, 3, 4].map(n => (
                                    <button
                                        key={n}
                                        onClick={() => setNumTeams(n)}
                                        className={`flex-1 p-3 rounded-xl border-2 font-bold text-xl transition-all ${numTeams === n ? 'bg-brand-cyan border-brand-cyan text-white shadow-lg scale-105' : 'bg-gray-800 border-gray-700 text-gray-400'}`}
                                    >
                                        {n}
                                    </button>
                                ))}
                            </div>
                        </section>

                        {/* Category Selector */}
                        <section>
                            <div className="flex justify-between items-center mb-2">
                                <label className="block text-sm font-bold text-gray-400 uppercase">Categorías</label>
                                <button
                                    onClick={toggleAllCategories}
                                    className="text-xs font-bold text-brand-pink hover:text-white transition-colors uppercase"
                                >
                                    {selectedCategories.length === availableCategories.length ? 'Desmarcar Todo' : 'Marcar Todo'}
                                </button>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                {availableCategories.map(cat => {
                                    const isSelected = selectedCategories.includes(cat);
                                    return (
                                        <button
                                            key={cat}
                                            onClick={() => toggleCategory(cat)}
                                            className={`p-3 rounded-xl border-2 font-bold capitalize transition-all duration-200 ${isSelected ? 'bg-brand-pink border-brand-pink text-white shadow-lg scale-[1.02]' : 'bg-gray-800 border-gray-700 text-gray-400 hover:border-gray-500'}`}
                                        >
                                            <div className="flex items-center justify-between w-full">
                                                <span>{cat}</span>
                                                {isSelected && <Icon name="check" size="sm" />}
                                            </div>
                                        </button>
                                    )
                                })}
                            </div>
                            {selectedCategories.length === 0 && <p className="text-red-400 text-sm mt-2 font-bold animate-pulse">¡Elige al menos una!</p>}
                        </section>

                        {/* Options */}
                        <section>
                            <label className="block text-sm font-bold text-gray-400 uppercase mb-2">Opciones</label>
                            <div
                                onClick={() => setRouletteEnabled(!rouletteEnabled)}
                                className={`flex items-center justify-between p-4 rounded-2xl border-2 cursor-pointer transition-all ${rouletteEnabled ? 'bg-brand-purple border-brand-pink' : 'bg-gray-800 border-gray-700'}`}
                            >
                                <span className="font-bold flex items-center gap-2">
                                    <Icon name="casino" size="md" /> Ruleta de Retos
                                </span>
                                <div className={`w-12 h-6 rounded-full p-1 transition-colors ${rouletteEnabled ? 'bg-brand-yellow' : 'bg-gray-600'}`}>
                                    <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${rouletteEnabled ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div className="pt-4 bg-gradient-to-t from-gray-900 via-gray-900 to-transparent">
                        <Button
                            onClick={generateTeams}
                            disabled={names.length < numTeams || selectedCategories.length === 0}
                            className={`w-full ${names.length < numTeams || selectedCategories.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}`}
                            color="brand-cyan"
                            size="lg"
                        >
                            Crear Equipos
                        </Button>
                        {names.length < numTeams && <p className="text-red-400 text-center text-sm font-bold mt-2">Faltan Jugadores</p>}
                    </div>
                </div>
            );
        };

        const Roulette = ({ onComplete }) => {
            const [spinning, setSpinning] = useState(false);
            const [displayChallenge, setDisplayChallenge] = useState(null);
            const [finalReview, setFinalReview] = useState(false);

            // Ref for the animation interval
            const intervalRef = useRef(null);

            const spin = () => {
                if (spinning) return;
                setSpinning(true);
                setFinalReview(false);

                let speed = 50; // Initial speed (ms)
                let counter = 0;
                const totalSpins = 40; // Total text changes before stopping

                const animate = () => {
                    // Randomly pick one to show
                    const randomChal = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
                    setDisplayChallenge(randomChal);

                    counter++;

                    if (counter < totalSpins) {
                        // Slow down logic
                        if (counter > totalSpins - 10) speed += 30;
                        if (counter > totalSpins - 5) speed += 50;

                        intervalRef.current = setTimeout(animate, speed);
                    } else {
                        // Stop!
                        setSpinning(false);
                        setFinalReview(true);
                        // Vibrate if mobile supports
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    }
                };

                animate();
            };

            // Cleanup in case of unmount
            useEffect(() => {
                return () => clearTimeout(intervalRef.current);
            }, []);

            return (
                <div className="flex flex-col items-center justify-center p-6 text-center h-full">
                    {!finalReview && !spinning ? (
                        <>
                            <div className="mb-4">
                                <div className="text-9xl animate-bounce-slow">🎰</div>
                                <div className="text-xl font-bold text-gray-400 mt-2">¿Preparado?</div>
                            </div>
                            <h2 className="text-4xl font-display font-black mb-8 text-brand-yellow drop-shadow-lg">RULETA DE RETOS</h2>
                            <Button onClick={spin} size="lg" color="brand-purple" className="w-full max-w-xs shadow-2xl">⚡ GIRAR ⚡</Button>
                        </>
                    ) : (
                        <div className="w-full max-w-sm flex flex-col items-center">
                            <h2 className="text-xl font-bold text-gray-400 uppercase tracking-widest mb-6">
                                {spinning ? "Buscando tu destino..." : "¡Tu Reto Es!"}
                            </h2>

                            {/* The Slot Machine Display */}
                            <div className={`
                                bg-gray-800 border-4 ${spinning ? 'border-brand-purple animate-pulse' : 'border-brand-pink'} 
                                rounded-3xl p-8 mb-8 w-full min-h-[200px] flex items-center justify-center shadow-2xl relative overflow-hidden
                            `}>
                                {/* Background beams effect if finished */}
                                {!spinning && (
                                    <div className="absolute inset-0 bg-brand-pink/20 animate-pulse"></div>
                                )}

                                <p className={`
                                    text-3xl font-black leading-tight relative z-10 transition-all duration-100
                                    ${spinning ? 'blur-[1px] scale-95 opacity-80' : 'scale-110 opacity-100 text-brand-yellow text-shadow-lg'}
                                `}>
                                    {displayChallenge ? displayChallenge.text : "..."}
                                </p>
                            </div>

                            {!spinning && (
                                <div className="animate-slide-up w-full space-y-3">
                                    <Button onClick={() => onComplete(displayChallenge)} size="lg" color="brand-cyan" className="w-full shadow-2xl">
                                        ¡Aceptar Reto!
                                    </Button>
                                    <button onClick={spin} className="text-gray-500 text-sm font-bold hover:text-white underline decoration-dashed">
                                        Re-Girar (Tramposo...)
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const Game = ({ teams, settings, onEndGame }) => {
            // Game State
            const [round, setRound] = useState(1);
            const [currentTeamIdx, setCurrentTeamIdx] = useState(0);
            // Track which player index is up next for each team
            const [teamPlayerIndices, setTeamPlayerIndices] = useState(teams.map(() => 0));
            const [deck, setDeck] = useState([]);
            const [turnDeck, setTurnDeck] = useState([]); // Cards for current turn usage or reshuffling

            // Turn State
            const [phase, setPhase] = useState('PRE_TURN'); // PRE_TURN, ROULETTE, PLAYING, SUMMARY
            const [challenge, setChallenge] = useState(null);
            const [timeLeft, setTimeLeft] = useState(60);
            const [currentCard, setCurrentCard] = useState(null);
            const [scoreThisTurn, setScoreThisTurn] = useState(0);

            const handleChallengeFail = () => {
                // End turn immediately if challenge failed
                endTurn();
            };



            // Init Deck
            // Init Deck
            useEffect(() => {
                // Settings.categories is now an array passed from Lobby
                let categories = settings.categories || ['random'];
                let words = [];

                // Get words from all selected categories (handle if singular for legacy safety)
                if (!Array.isArray(categories)) categories = [categories];

                categories.forEach(c => {
                    if (WORD_DB[c]) words = words.concat(WORD_DB[c]);
                });

                // Shuffle and pick subset
                // INCREASED DECK SIZE from 30 to 40
                const gameDeck = words.sort(() => 0.5 - Math.random()).slice(0, 40);
                setDeck(gameDeck);
            }, []);

            // Timer
            useEffect(() => {
                let interval;
                if (phase === 'PLAYING' && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
                } else if (timeLeft === 0 && phase === 'PLAYING') {
                    endTurn();
                }
                return () => clearInterval(interval);
            }, [phase, timeLeft]);

            const currentTeam = teams[currentTeamIdx];
            const currentPlayerName = currentTeam.members[teamPlayerIndices[currentTeamIdx]];

            const startTurn = () => {
                if (settings.rouletteEnabled) {
                    setPhase('ROULETTE');
                } else {
                    setPhase('PLAYING');
                    setTimeLeft(60);
                    setScoreThisTurn(0);
                    pickCard();
                }
            };

            const onRouletteDone = (chal) => {
                setChallenge(chal);
                setPhase('PLAYING');
                setTimeLeft(60);
                setScoreThisTurn(0);
                pickCard();
            };

            const pickCard = () => {
                setDeck(currentDeck => {
                    if (newDeck.length === 0) {
                        setCurrentCard(null);
                        const card = currentDeck[0]; // Wait, logic error in original? No, if empty logic handles it.
                        // Actually original logic had a return inside if.
                        // Let's stick to simple safety.
                        setTimeout(() => endTurn(true), 0);
                        return currentDeck;
                    }
                    const card = currentDeck[0];
                    setCurrentCard(card);
                    return currentDeck;
                });
            };

            const handleAnswer = (correct) => {
                if (!currentCard) return;

                if (correct) {
                    currentTeam.score += 1;
                    setScoreThisTurn(s => s + 1);

                    // Add to "Next Round Pile"
                    setTurnDeck(prev => [...prev, currentCard]);

                    // Remove from Current Deck
                    setDeck(prev => {
                        const newDeck = prev.slice(1);
                        // Check immediate end
                        if (newDeck.length === 0) {
                            setTimeout(() => endTurn(true), 0);
                        } else {
                            // Pick next
                            setTimeout(() => {
                                setCurrentCard(newDeck[0]);
                            }, 50);
                        }
                        return newDeck;
                    });
                } else {
                    // Pass: Recycle directly to bottom of effective deck
                    setDeck(prev => {
                        const newDeck = [...prev.slice(1), currentCard];
                        setTimeout(() => {
                            setCurrentCard(newDeck[0]);
                        }, 50);
                        return newDeck;
                    });
                }
            };

            const endTurn = (roundEnded = false) => {
                setPhase('SUMMARY');
                // Clean up turn state
            };

            const nextStep = () => {
                // If the deck is empty (length 0), the round is over.
                if (deck.length === 0) {
                    // ROUND ENDED
                    if (round === 3) {
                        onEndGame(teams); // GAME OVER
                    } else {
                        // PREPARE NEXT ROUND
                        setRound(r => r + 1);

                        // Restore deck from 'turnDeck' (cards guessed this round) 
                        const fullDeck = [...turnDeck].sort(() => 0.5 - Math.random());
                        setDeck(fullDeck);
                        setTurnDeck([]); // Reset accumulator

                        // Rotate player for the team that just finished
                        setTeamPlayerIndices(prev => {
                            const newIndices = [...prev];
                            newIndices[currentTeamIdx] = (newIndices[currentTeamIdx] + 1) % teams[currentTeamIdx].members.length;
                            return newIndices;
                        });

                        // Pass turn
                        setCurrentTeamIdx((currentTeamIdx + 1) % teams.length);
                        setPhase('PRE_TURN');
                    }
                } else {
                    // Just next turn

                    // Rotate player for the team that just finished
                    setTeamPlayerIndices(prev => {
                        const newIndices = [...prev];
                        newIndices[currentTeamIdx] = (newIndices[currentTeamIdx] + 1) % teams[currentTeamIdx].members.length;
                        return newIndices;
                    });

                    setCurrentTeamIdx((currentTeamIdx + 1) % teams.length);
                    setPhase('PRE_TURN');
                }
            };

            // Render
            if (phase === 'PRE_TURN') {
                return (
                    <div className={`flex flex-col h-screen p-6 items-center justify-center text-center ${currentTeam.bg} transition-colors duration-500`}>
                        <h2 className="text-xl uppercase font-bold text-white/80 mb-2">Turno del Equipo</h2>
                        <h1 className="text-6xl font-display text-white mb-4">{currentTeam.name}</h1>

                        <div className="bg-black/30 px-6 py-3 rounded-2xl mb-8 animate-pulse">
                            <p className="text-sm font-bold text-gray-300 uppercase mb-1">Le toca a</p>
                            <p className="text-3xl font-black text-brand-yellow">{currentPlayerName}</p>
                        </div>

                        <div className="bg-white/20 p-6 rounded-3xl backdrop-blur-md mb-8 w-full max-w-sm">
                            <p className="text-xl font-bold uppercase mb-1">Ronda {round}</p>
                            <p className="text-3xl font-display text-white">
                                {round === 1 ? "Descripción" : round === 2 ? "Una Palabra" : "Mímica"}
                            </p>
                        </div>

                        <Button onClick={startTurn} color="brand-yellow" size="lg" className="w-full max-w-xs shadow-xl">¡Empezar!</Button>
                        <div className="mt-8 grid grid-cols-2 gap-4 w-full max-w-sm">
                            {teams.map((t, i) => (
                                <div key={i} className="flex justify-between bg-black/20 p-2 rounded-lg">
                                    <span>{t.name}</span>
                                    <span className="font-bold">{t.score}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (phase === 'ROULETTE') {
                return (
                    <Modal isOpen={true}>
                        <div className="bg-gray-900 rounded-3xl overflow-hidden border-4 border-brand-purple h-[60vh]">
                            <Roulette onComplete={onRouletteDone} />
                        </div>
                    </Modal>
                );
            }

            if (phase === 'SUMMARY') {
                const isRoundEnd = deck.length === 0;
                return (
                    <div className="flex flex-col h-screen p-6 items-center justify-center text-center space-y-6">
                        <h2 className="text-4xl font-display text-white">¡Tiempo!</h2>
                        <Card className="w-full max-w-xs bg-brand-cyan text-black">
                            <p className="text-xl font-bold uppercase mb-2">Puntos este turno</p>
                            <p className="text-8xl font-display">{scoreThisTurn}</p>
                        </Card>

                        {isRoundEnd && (
                            <div className="bg-brand-yellow text-black px-6 py-3 rounded-xl font-bold text-xl animate-bounce-slow">
                                ¡RONDA {round} COMPLETADA!
                            </div>
                        )}

                        <Button onClick={nextStep} color="brand-pink" size="lg" className="w-full max-w-xs">
                            {isRoundEnd && round === 3 ? "Ver Resultados Finales" : "Siguiente Equipo"}
                        </Button>
                    </div>
                );
            }

            // PLAYING PHASE
            return (
                <div className={`flex flex-col h-screen p-4 ${currentTeam.bg} transition-colors duration-500`}>
                    {/* Top Bar */}
                    <div className="flex justify-between items-center mb-6">
                        <div className="bg-black/30 px-4 py-2 rounded-full font-mono font-bold text-xl flex items-center gap-2">
                            <Icon name="timer" size="sm" /> {timeLeft}s
                        </div>
                        <div className="bg-black/30 px-4 py-2 rounded-full font-bold text-xl">
                            {deck.length} cartas
                        </div>
                    </div>

                    {/* Challenge Reminder */}
                    <div className="bg-black/20 text-center py-2 px-4 rounded-xl mb-4 text-sm font-bold flex items-center justify-center gap-2">
                        <Icon name="warning" size="sm" className="text-brand-yellow" />
                        Reto: {challenge?.text || 'Ninguno'}
                    </div>

                    {/* Card */}
                    <div className="flex-1 flex flex-col justify-center items-center mb-8 relative w-full px-4">
                        {/* Card Stack Effect */}
                        <div className="absolute w-full max-w-sm h-80 bg-white/10 rounded-3xl transform rotate-3 scale-95 top-10" />
                        <div className="absolute w-full max-w-sm h-80 bg-white/20 rounded-3xl transform -rotate-2 scale-98 top-5" />

                        <div className="w-full max-w-sm bg-white text-gray-900 rounded-3xl shadow-2xl overflow-hidden animate-pop border-b-8 border-gray-300 relative flex flex-col items-center z-10 min-h-[400px] justify-center">

                            <div className="p-8 text-center w-full z-10 flex flex-col justify-center items-center">
                                <h2 className="text-6xl font-black font-display text-gray-900 uppercase tracking-tight break-words leading-none">
                                    {currentCard || "..."}
                                </h2>
                            </div>
                        </div>
                    </div>

                    {/* Controls */}
                    <div className="grid grid-cols-3 gap-2 pb-4 h-24">
                        <Button onClick={() => handleAnswer(false)} color="gray" size="lg" className="flex flex-col items-center justify-center">
                            <Icon name="close" size="md" />
                            <span className="text-xs mt-1">PASAR</span>
                        </Button>
                        <Button onClick={handleChallengeFail} color="red" size="lg" className="flex flex-col items-center justify-center">
                            <Icon name="warning" size="md" />
                            <span className="text-xs mt-1">FALLÓ RETO</span>
                        </Button>
                        <Button onClick={() => handleAnswer(true)} color="green" size="lg" className="flex flex-col items-center justify-center">
                            <Icon name="check" size="md" />
                            <span className="text-xs mt-1">BIEN</span>
                        </Button>
                    </div>
                </div>
            );
        };

        const Victory = ({ teams, onRestart }) => {
            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);

            return (
                <div className="flex flex-col h-screen p-6 items-center justify-center bg-brand-dark overflow-y-auto">
                    <h1 className="text-5xl font-display text-brand-yellow mb-8 text-center text-shadow-lg">¡Resultados!</h1>

                    <div className="w-full max-w-md space-y-4 mb-10">
                        {sortedTeams.map((team, idx) => (
                            <div key={idx} className={`bg-gray-800 rounded-2xl p-4 flex items-center justify-between border-b-4 border-gray-700 animate-slide-up`} style={{ animationDelay: `${idx * 100}ms` }}>
                                <div className="flex items-center gap-4">
                                    <span className="text-3xl font-display w-8 text-center">{idx + 1}º</span>
                                    <div className={`w-4 h-4 rounded-full ${team.bg}`}></div>
                                    <span className="text-xl font-bold">{team.name}</span>
                                </div>
                                <span className="text-3xl font-display text-brand-pink">{team.score} pts</span>
                            </div>
                        ))}
                    </div>

                    <Button onClick={onRestart} color="brand-cyan" size="lg" className="w-full max-w-xs animate-bounce-slow">
                        Jugar Otra Vez
                    </Button>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            // Phases: TUTORIAL -> LOBBY -> GAME -> VICTORY
            const [appPhase, setAppPhase] = useState('TUTORIAL');
            const [gameData, setGameData] = useState({ teams: [], settings: {} });

            const handleTutorialEnd = () => setAppPhase('LOBBY');

            const handleGameStart = (teams, category, rouletteEnabled) => {
                setGameData({ teams, settings: { category, rouletteEnabled, roundDuration: 60 } });
                setAppPhase('GAME');
            };

            const handleGameEnd = (finalTeams) => {
                // Update teams score one last time if needed (usually refs match)
                setAppPhase('VICTORY');
            };

            const handleRestart = () => {
                setAppPhase('LOBBY'); // Back to Lobby to maybe shuffle teams
            };

            return (
                <div className="antialiased text-white h-screen w-screen overflow-hidden">
                    {appPhase === 'TUTORIAL' && <Tutorial onStart={handleTutorialEnd} />}
                    {appPhase === 'LOBBY' && <Lobby onGameStart={handleGameStart} />}
                    {appPhase === 'GAME' && <Game teams={gameData.teams} settings={gameData.settings} onEndGame={handleGameEnd} />}
                    {appPhase === 'VICTORY' && <Victory teams={gameData.teams} onRestart={handleRestart} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
